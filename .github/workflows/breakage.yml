name: Host breakage issues

# The extension reports whether its UI made it onto host pages (/api/breakage, from
# shared/breakage.ts). Hourly, the latest verdict per site and check opens an issue
# when it's broken and closes it once it shows again.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: breakage
  cancel-in-progress: false

jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 65.108.153.112 >> ~/.ssh/known_hosts

      # Over SSH: Cloudflare challenges runner IPs (see deploy-web.yml).
      - name: Read the latest verdicts
        run: |
          ssh root@65.108.153.112 sqlite3 -readonly /var/lib/truescore/cache.sqlite > latest.tsv <<'SQL'
          .mode tabs
          SELECT json_extract(data, '$.site'), json_extract(data, '$.check'), json_extract(data, '$.ok'),
                 json_extract(data, '$.path'), json_extract(data, '$.version'), max(ts)
          FROM session_events WHERE type = 'breakage' GROUP BY 1, 2;
          SQL
          cat latest.tsv

      - name: Open and close issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create breakage --color B60205 --description "TrueScore lost its place on a host page" --force
          open=$(gh issue list --label breakage --state open --limit 200 --json number,title)
          while IFS=$'\t' read -r site check ok page version ts; do
            title="$site: $check isn't showing"
            number=$(jq -r --arg t "$title" '.[] | select(.title == $t) | .number' <<<"$open")
            if [ "$ok" = 0 ] && [ -z "$number" ]; then
              gh issue create --label breakage --title "$title" --body "TrueScore had the data for \`$check\` on https://$site$page but couldn't find where to show it (extension v$version, $(date -u -d @$((ts / 1000)) '+%F %H:%M') UTC). The host has likely changed its markup.

          This closes itself once the extension sees \`$check\` showing on $site again."
            elif [ "$ok" = 1 ] && [ -n "$number" ]; then
              gh issue close "$number" --comment "Showing again on https://$site$page (extension v$version)."
            fi
          done < latest.tsv
